<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>台鐵即時列車看板｜正式版</title>
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --primary-color: #1976d2;
      --text-main: #212121;
      --text-muted: #666666;
      --on-time-color: #2e7d32;
      --delay-color: #c62828;
      --delay-bg: #ffebee;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 16px;
      max-width: 500px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding: 12px 0 20px 0;
    }

    h1 {
      font-size: 1.35rem;
      color: #1a237e;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .station-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background-color: #e8eaf6;
      color: #283593;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.95rem;
      font-weight: 600;
    }

    .section-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #37474f;
      margin: 18px 0 10px 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .board-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .train-card {
      background-color: var(--card-bg);
      border-radius: 10px;
      padding: 12px 16px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .train-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .train-type {
      font-size: 1.05rem;
      font-weight: 700;
      color: #111111;
    }

    .train-dest {
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    .train-time-box {
      text-align: right;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .scheduled-time {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: 0.5px;
    }

    .scheduled-time .time-prefix {
      font-size: 0.85rem;
      font-weight: 400;
      color: var(--text-muted);
      margin-right: 4px;
    }

    .status-tag {
      font-size: 0.82rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
      white-space: nowrap;
    }

    .status-ontime {
      display: none; /* 準點時只顯示時間，不特地留標籤空間 */
    }

    .status-delay {
      background-color: var(--delay-bg);
      color: var(--delay-color);
    }

    .empty-card {
      background-color: var(--card-bg);
      border-radius: 10px;
      padding: 16px;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .refresh-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      margin: 20px 0 10px 0;
      padding: 13px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(25, 118, 210, 0.25);
    }

    .refresh-btn:active {
      opacity: 0.88;
    }

    #status-msg {
      text-align: center;
      padding: 30px 10px;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .spinner {
      border: 3px solid #e0e0e0;
      border-top: 3px solid var(--primary-color);
      border-radius: 50%;
      width: 26px;
      height: 26px;
      animation: spin 0.9s linear infinite;
      margin: 0 auto 12px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  
  .live-banner{font-size:12px;color:#644315;background:#fff5d7;border:1px solid #e8c57f;padding:9px 12px;border-radius:9px;margin-bottom:12px;line-height:1.6}
  </style>
</head>
<body>
<div class="live-banner">⚠️ 台鐵即時資料來源約每 2 分鐘更新，顯示資訊可能有延遲。本頁開啟且可見時每 30 秒重新查詢，或按下方按鈕手動更新。</div>

  <header>
    <h1>即時列車時刻表</h1>
    <div id="station-info" class="station-badge">📍 定位中...</div>
    <div id="sync-status" aria-live="polite" style="font-size:0.78rem;color:#52616b;margin-top:10px;">尚未取得列車資料</div>
  </header>

  <div id="status-msg">
    <div class="spinner"></div>
    正在搜尋離你最近的車站...
  </div>

  <main id="content-area" style="display: none;">
    <!-- 即時列車區塊（依後端方向欄位） -->
    <div class="section-title">🚆 順行（依資料方向）</div>
    <div id="northbound-list" class="board-list"></div>

    <!-- 南列車區塊 -->
    <div class="section-title" style="margin-top: 22px;">🚆 逆行（依資料方向）</div>
    <div id="southbound-list" class="board-list"></div>
    <div id="other-section" style="display:none;"><div class="section-title">🚆 方向待確認</div><div id="other-list" class="board-list"></div></div>

    <button class="refresh-btn" onclick="initLocation()">🔄 更新台鐵真實班次</button>
  </main>

  <script>
    // ⚠️ 填入你的 GAS 發布 Web App 網址
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbxOV_Ya5irn24iyc3FiFk3gIVhsNyP1b32Xl5qZgcL1TcF0DMYs8wSS6-BBghNnyCqC/exec';


    const POLL_INTERVAL_MS = 30000;
    let lastCoords = null;
    let pollTimer = null;
    let pendingRequest = false;
    let lastSuccessfulFetch = false;

    function pageIsVisible() {
      return document.visibilityState !== 'hidden';
    }

    function setSyncStatus(message) {
      document.getElementById('sync-status').textContent = message;
    }

    function stopPolling() {
      if (pollTimer !== null) {
        clearInterval(pollTimer);
        pollTimer = null;
      }
    }

    function startPolling() {
      stopPolling();
      if (!pageIsVisible() || !lastCoords) return;
      pollTimer = setInterval(() => {
        if (pageIsVisible() && lastCoords && !pendingRequest) {
          fetchTrainBoard(lastCoords.lat, lastCoords.lng);
        }
      }, POLL_INTERVAL_MS);
    }

    window.addEventListener('load', () => initLocation());
    document.addEventListener('visibilitychange', () => {
      if (!pageIsVisible()) {
        stopPolling();
        setSyncStatus('頁面已切到背景，暫停自動查詢');
      } else {
        if (lastCoords) {
          startPolling();
          fetchTrainBoard(lastCoords.lat, lastCoords.lng);
        } else {
          initLocation();
        }
      }
    });
    window.addEventListener('pagehide', stopPolling);
    window.addEventListener('pageshow', event => {
      if (event.persisted && pageIsVisible()) {
        if (lastCoords) {
          startPolling();
          fetchTrainBoard(lastCoords.lat, lastCoords.lng);
        } else {
          initLocation();
        }
      }
    });

    function initLocation() {
      const statusEl = document.getElementById('status-msg');
      const contentArea = document.getElementById('content-area');
      if (!lastSuccessfulFetch) {
        statusEl.style.display = 'block';
        contentArea.style.display = 'none';
        statusEl.innerHTML = '<div class="spinner"></div>正在讀取 GPS 座標...';
      }
      setSyncStatus('正在確認位置…');

      if (!navigator.geolocation) {
        setSyncStatus('裝置不支援 GPS 定位');
        if (!lastSuccessfulFetch) statusEl.textContent = '❌ 裝置不支援 GPS 定位';
        return;
      }

      navigator.geolocation.getCurrentPosition(
        position => {
          lastCoords = { lat: position.coords.latitude, lng: position.coords.longitude };
          startPolling();
          fetchTrainBoard(lastCoords.lat, lastCoords.lng);
        },
        error => {
          const message = error.code === 1 ? '請開啟位置存取權限' : '無法取得 GPS 位置';
          setSyncStatus('⚠️ ' + message);
          if (!lastSuccessfulFetch) statusEl.textContent = '❌ ' + message;
          if (lastCoords && pageIsVisible()) {
            startPolling();
            fetchTrainBoard(lastCoords.lat, lastCoords.lng);
          }
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 }
      );
    }

    async function fetchTrainBoard(lat, lng) {
      if (!pageIsVisible() || pendingRequest) return;
      pendingRequest = true;
      const statusEl = document.getElementById('status-msg');
      const contentArea = document.getElementById('content-area');
      const controller = new AbortController();
      const abortTimer = setTimeout(() => controller.abort(), 20000);
      if (!lastSuccessfulFetch) {
        statusEl.style.display = 'block';
        statusEl.innerHTML = '<div class="spinner"></div>正在讀取最近車站與列車班次...';
      }
      setSyncStatus('正在查詢台鐵班次…');
      try {
        const response = await fetch(
          GAS_URL + '?lat=' + encodeURIComponent(lat) + '&lng=' + encodeURIComponent(lng),
          {signal: controller.signal, cache: 'no-store'}
        );
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const data = await response.json();
        if (!data || data.status !== 'success' || !data.station || !Array.isArray(data.liveBoard)) {
          throw new Error(String(data?.message || data?.status || '後端回應格式不符'));
        }
        const stationName = String(data.station.StationName || '未知車站');
        document.getElementById('station-info').textContent =
          '📍 ' + stationName + ' (' + String(data.station.DistanceKm ?? '?') + ' km)';
        renderBoard(data.liveBoard);
        lastSuccessfulFetch = true;
        statusEl.style.display = 'none';
        contentArea.style.display = 'block';
        const time = new Date().toLocaleTimeString('zh-TW', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
        setSyncStatus('最後查詢 ' + time + '｜每 30 秒更新（資料源約每 2 分鐘更新）');
      } catch (error) {
        console.error('台鐵資料查詢失敗', error);
        const message = '⚠️ 查詢失敗，請檢查網路或後端（仍可手動重試）';
        setSyncStatus(message);
        if (!lastSuccessfulFetch) {
          statusEl.textContent = message;
        }
      } finally {
        clearTimeout(abortTimer);
        pendingRequest = false;
      }
    }

    function renderBoard(trains) {
      const northboundContainer = document.getElementById('northbound-list');
      const southboundContainer = document.getElementById('southbound-list');

      northboundContainer.innerHTML = '';
      southboundContainer.innerHTML = '';

      if (!trains || trains.length === 0) {
        northboundContainer.innerHTML = '<div class="empty-card">目前無即時班車資料</div>';
        southboundContainer.innerHTML = '<div class="empty-card">目前無即時班車資料</div>';
        return;
      }

      const northboundTrains = [];
      const southboundTrains = [];
      const otherTrains = [];

      // 優先使用後端回傳的 Direction / direction（0 順行，1 逆行）。
      trains.forEach(train => {
        const dir = Number(train.direction ?? train.Direction);
        if ((train.direction ?? train.Direction) != null && dir === 0) {
          northboundTrains.push(train);
        } else if ((train.direction ?? train.Direction) != null && dir === 1) {
          southboundTrains.push(train);
        } else {
          // 未提供方向時，不再憑車次奇偶數猜測方向，避免誤導。
          otherTrains.push(train);
        }
      });

      renderTrainList(northboundTrains, northboundContainer);
      renderTrainList(southboundTrains, southboundContainer);
      document.getElementById("other-section").style.display=otherTrains.length?"block":"none";
      if(otherTrains.length)renderTrainList(otherTrains,document.getElementById("other-list"));
    }

    function escapeText(v) {
      return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function renderTrainList(trainList, container) {
      if (trainList.length === 0) {
        container.innerHTML = '<div class="empty-card">1 小時內無即時班車</div>';
        return;
      }

      trainList.forEach(train => {
        const isDelay = Number(train.delayTime) > 0;
        
        // 1. 簡化車種名稱（去掉括號詳細說明）
        const cleanType = String(train.trainTypeName || '列車').split('(')[0];
        
        // 2. 時間去秒 (18:17:00 -> 18:17)
        const rawTime=String(train.scheduledDepartureTime || "");
        const tmatch=rawTime.match(/(?:T|\s)(\d{2}:\d{2})/)||rawTime.match(/^(\d{1,2}:\d{2})/);
        const timeShort=tmatch?tmatch[1]:"--:--";
        
        // 3. 誤點時才加上 "原訂"，準點時只顯示時間
        const timeDisplay = isDelay ? `<span class="time-prefix">原訂</span>${escapeText(timeShort)}` : escapeText(timeShort);
        
        // 4. 延誤標示 (例如: 晚 3 分)
        const delayText = isDelay ? `晚 ${escapeText(Number(train.delayTime))} 分` : '';
        const delayClass = isDelay ? 'status-delay' : 'status-ontime';

        const card = document.createElement('div');
        card.className = 'train-card';
        card.innerHTML = `
          <div class="train-info">
            <div class="train-type">${escapeText(cleanType)} ${escapeText(train.trainNo)}</div>
            <div class="train-dest">往 ${escapeText(train.endingStationName || '未提供')}</div>
          </div>
          <div class="train-time-box">
            <div class="scheduled-time">${timeDisplay}</div>
            ${isDelay ? `<span class="status-tag ${delayClass}">${delayText}</span>` : ''}
          </div>
        `;
        container.appendChild(card);
      });
    }
  </script>
</body>
</html>
