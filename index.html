<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>離我最近 - 台鐵即時看板</title>
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --primary-color: #1976d2;
      --text-main: #212121;
      --text-muted: #666666;
      --on-time-color: #2e7d32;
      --delay-color: #c62828;
      --delay-bg: #ffebee;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 16px;
      max-width: 500px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding: 12px 0 20px 0;
    }

    h1 {
      font-size: 1.35rem;
      color: #1a237e;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .station-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background-color: #e8eaf6;
      color: #283593;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.95rem;
      font-weight: 600;
    }

    .section-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #37474f;
      margin: 18px 0 10px 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .board-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .train-card {
      background-color: var(--card-bg);
      border-radius: 10px;
      padding: 12px 16px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .train-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .train-type {
      font-size: 1.05rem;
      font-weight: 700;
      color: #111111;
    }

    .train-dest {
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    .train-time-box {
      text-align: right;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .scheduled-time {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: 0.5px;
    }

    .scheduled-time .time-prefix {
      font-size: 0.85rem;
      font-weight: 400;
      color: var(--text-muted);
      margin-right: 4px;
    }

    .status-tag {
      font-size: 0.82rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
      white-space: nowrap;
    }

    .status-ontime {
      display: none; /* 準點時只顯示時間，不特地留標籤空間 */
    }

    .status-delay {
      background-color: var(--delay-bg);
      color: var(--delay-color);
    }

    .empty-card {
      background-color: var(--card-bg);
      border-radius: 10px;
      padding: 16px;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .refresh-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      margin: 20px 0 10px 0;
      padding: 13px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(25, 118, 210, 0.25);
    }

    .refresh-btn:active {
      opacity: 0.88;
    }

    #status-msg {
      text-align: center;
      padding: 30px 10px;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .spinner {
      border: 3px solid #e0e0e0;
      border-top: 3px solid var(--primary-color);
      border-radius: 50%;
      width: 26px;
      height: 26px;
      animation: spin 0.9s linear infinite;
      margin: 0 auto 12px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <header>
    <h1>即時列車時刻表</h1>
    <div id="station-info" class="station-badge">📍 定位中...</div>
  </header>

  <div id="status-msg">
    <div class="spinner"></div>
    正在搜尋離你最近的車站...
  </div>

  <main id="content-area" style="display: none;">
    <!-- 北上列車區塊 -->
    <div class="section-title">🚆 北上 (順行)</div>
    <div id="northbound-list" class="board-list"></div>

    <!-- 南列車區塊 -->
    <div class="section-title" style="margin-top: 22px;">🚆 南下 (逆行)</div>
    <div id="southbound-list" class="board-list"></div>

    <button class="refresh-btn" onclick="initLocation()">🔄 重新整理看板</button>
  </main>

  <script>
    // ⚠️ 填入你的 GAS 發布 Web App 網址
    const GAS_URL = 'YOUR_GAS_WEB_APP_URL_HERE';

    window.onload = function() {
      initLocation();
    };

    function initLocation() {
      const statusEl = document.getElementById('status-msg');
      const contentArea = document.getElementById('content-area');
      
      statusEl.style.display = 'block';
      contentArea.style.display = 'none';
      statusEl.innerHTML = '<div class="spinner"></div>正在讀取 GPS 座標...';

      if (!navigator.geolocation) {
        statusEl.innerHTML = '❌ 你的裝置不支援 GPS 定位功能';
        return;
      }

      navigator.geolocation.getCurrentPosition(
        position => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          fetchTrainBoard(lat, lng);
        },
        error => {
          let errorMsg = '無法取得位置資訊';
          if (error.code === error.PERMISSION_DENIED) {
            errorMsg = '❌ 請開啟瀏覽器的「位置存取權限」';
          }
          statusEl.innerHTML = errorMsg;
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }

    function fetchTrainBoard(lat, lng) {
      const statusEl = document.getElementById('status-msg');
      const contentArea = document.getElementById('content-area');
      
      statusEl.innerHTML = '<div class="spinner"></div>正在比對最近車站與列車班次...';

      fetch(`${GAS_URL}?lat=${lat}&lng=${lng}`)
        .then(res => res.json())
        .then(data => {
          if (data.status !== 'success') {
            statusEl.innerHTML = `⚠️ 錯誤: ${data.message}`;
            return;
          }

          document.getElementById('station-info').innerText = 
            `📍 ${data.station.StationName} (${data.station.DistanceKm} km)`;

          renderBoard(data.liveBoard);
          statusEl.style.display = 'none';
          contentArea.style.display = 'block';
        })
        .catch(err => {
          statusEl.innerHTML = '❌ 連線失敗，請檢查網路或 GAS 網址設定';
          console.error(err);
        });
    }

    function renderBoard(trains) {
      const northboundContainer = document.getElementById('northbound-list');
      const southboundContainer = document.getElementById('southbound-list');

      northboundContainer.innerHTML = '';
      southboundContainer.innerHTML = '';

      if (!trains || trains.length === 0) {
        northboundContainer.innerHTML = '<div class="empty-card">目前無即時班車資料</div>';
        southboundContainer.innerHTML = '<div class="empty-card">目前無即時班車資料</div>';
        return;
      }

      const northboundTrains = [];
      const southboundTrains = [];

      // 西部幹線與多數台鐵線路判斷：
      // 車次號碼為偶數 (雙數) => 北上 / 順行 (例如 2214 次往基隆)
      // 車次號碼為奇數 (單數) => 南下 / 逆行 (例如 2033 次往彰化)
      trains.forEach(train => {
        const trainNoNum = parseInt(train.trainNo, 10);
        if (!isNaN(trainNoNum) && trainNoNum % 2 === 0) {
          northboundTrains.push(train);
        } else {
          southboundTrains.push(train);
        }
      });

      renderTrainList(northboundTrains, northboundContainer);
      renderTrainList(southboundTrains, southboundContainer);
    }

    function renderTrainList(trainList, container) {
      if (trainList.length === 0) {
        container.innerHTML = '<div class="empty-card">1 小時內無即時班車</div>';
        return;
      }

      trainList.forEach(train => {
        const isDelay = train.delayTime > 0;
        
        // 1. 簡化車種名稱（去掉括號詳細說明）
        const cleanType = train.trainTypeName.split('(')[0];
        
        // 2. 時間去秒 (18:17:00 -> 18:17)
        const timeShort = train.scheduledDepartureTime.substring(0, 5);
        
        // 3. 誤點時才加上 "原訂"，準點時只顯示時間
        const timeDisplay = isDelay ? `<span class="time-prefix">原訂</span>${timeShort}` : timeShort;
        
        // 4. 延誤標示 (例如: 晚 3 分)
        const delayText = isDelay ? `晚 ${train.delayTime} 分` : '';
        const delayClass = isDelay ? 'status-delay' : 'status-ontime';

        const card = document.createElement('div');
        card.className = 'train-card';
        card.innerHTML = `
          <div class="train-info">
            <div class="train-type">${cleanType} ${train.trainNo}</div>
            <div class="train-dest">往 ${train.endingStationName}</div>
          </div>
          <div class="train-time-box">
            <div class="scheduled-time">${timeDisplay}</div>
            ${isDelay ? `<span class="status-tag ${delayClass}">${delayText}</span>` : ''}
          </div>
        `;
        container.appendChild(card);
      });
    }
  </script>
</body>
</html>
