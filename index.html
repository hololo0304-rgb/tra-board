<script>
    // ⚠️ 請填入你在 GAS 發布後取得的 Web 應用程式 URL
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbxOV_Ya5irn24iyc3FiFk3gIVhsNyP1b32Xl5qZgcL1TcF0DMYs8wSS6-BBghNnyCqC/exec';

    // 網頁載入後立即呼叫 GPS
    window.onload = function() {
      initLocation();
    };

    function initLocation() {
      const statusEl = document.getElementById('status-msg');
      const boardContainer = document.getElementById('board-container');
      
      statusEl.style.display = 'block';
      statusEl.innerHTML = '<div class="spinner"></div>正在讀取 GPS 座標...';
      boardContainer.innerHTML = '';

      if (!navigator.geolocation) {
        statusEl.innerHTML = '❌ 你的裝置不支援 GPS 定位功能';
        return;
      }

      navigator.geolocation.getCurrentPosition(
        position => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          fetchTrainBoard(lat, lng);
        },
        error => {
          let errorMsg = '無法取得位置資訊';
          if (error.code === error.PERMISSION_DENIED) {
            errorMsg = '❌ 請開啟瀏覽器的「位置存取權限」';
          }
          statusEl.innerHTML = errorMsg;
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }

    function fetchTrainBoard(lat, lng) {
      const statusEl = document.getElementById('status-msg');
      statusEl.innerHTML = '<div class="spinner"></div>正在比對最近車站與列車班次...';

      fetch(`${GAS_URL}?lat=${lat}&lng=${lng}`)
        .then(res => res.json())
        .then(data => {
          if (data.status !== 'success') {
            statusEl.innerHTML = `⚠️ 錯誤: ${data.message}`;
            return;
          }

          // 更新車站名稱與距離
          document.getElementById('station-info').innerText = 
            `📍 最近車站：${data.station.StationName} (距離約 ${data.station.DistanceKm} km)`;

          renderBoard(data.liveBoard);
        })
        .catch(err => {
          statusEl.innerHTML = '❌ 連線失敗，請檢查網路或 GAS 網址設定';
          console.error(err);
        });
    }

    function renderBoard(trains) {
      const statusEl = document.getElementById('status-msg');
      const boardContainer = document.getElementById('board-container');

      if (!trains || trains.length === 0) {
        statusEl.innerHTML = '目前暫無即時班次資料';
        return;
      }

      statusEl.style.display = 'none'; // 隱藏載入提示
      boardContainer.innerHTML = '';

      trains.forEach(train => {
        // 1. 去掉秒數，只保留 時:分 (前 5 個字元)
        const timeShort = train.scheduledDepartureTime.substring(0, 5);
        
        // 2. 簡化車種名稱（去掉括號與備註，例如只保留「自強」）
        const cleanTrainType = train.trainTypeName.split('(')[0];

        // 3. 判斷延誤狀態並格式化文字
        const isDelay = train.delayTime > 0;
        const delayClass = isDelay ? 'status-delay' : 'status-ontime';
        
        // 依據是否延誤調整顯示格式
        const timeDisplay = isDelay ? `原訂 ${timeShort}` : timeShort;
        const delayText = isDelay ? `⚠️ 延誤 ${train.delayTime} 分鐘` : '✅ 準點';

        const card = document.createElement('div');
        card.className = 'train-card';
        card.innerHTML = `
          <div class="train-info">
            <div class="train-type">${cleanTrainType} ${train.trainNo} 次</div>
            <div class="train-dest">開往 ${train.endingStationName}</div>
          </div>
          <div class="train-time-box">
            <div class="scheduled-time">${timeDisplay}</div>
            <span class="status-tag ${delayClass}">${delayText}</span>
          </div>
        `;
        boardContainer.appendChild(card);
      });
    }
  </script>
